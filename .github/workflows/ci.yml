name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ["codex/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: What changed
    # A draft waits: marking it ready for review runs everything.
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          [ -z "$PR" ] && { echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; }  # a run by hand checks everything
          files=$(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only)
          echo "$files"
          # Anything but Markdown, docs/ and the license is code.
          if grep -qvE '^(docs/.*|.*\.md|LICENSE)$' <<< "$files"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: Secrets, lint, tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # macos-26 ships Xcode 26.6 by default: the toolchain the project is developed with.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: xcodebuild -version && swift --version

      - name: No keys or credentials
        run: make secrets

      - name: Formatting
        run: make lint

      - name: Unit and performance tests
        run: make test

  app:
    name: App and licenses
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      # Release, since the optimizer has crashed on code that builds in Debug, but for one
      # architecture and without a dSYM: this checks the isolated bundle.
      - name: Build and verify isolation
        run: make check-isolation CONFIGURATION=Release SIGNING_IDENTITY= XCODEBUILD_ARGS='ONLY_ACTIVE_ARCH=YES DEBUG_INFORMATION_FORMAT=dwarf'

      - name: License check
        run: make licenses
