# XcodeGen spec for the app. NotchWorkspace.xcodeproj is generated from this
# file and git-ignored: run `make project` (or `xcodegen generate`).
name: NotchWorkspace
options:
  bundleIdPrefix: io.github.johnvip
  deploymentTarget:
    macOS: "14.6"
  createIntermediateGroups: true
packages:
  OpenNotchKit:
    path: .

settingGroups:
  app:
    PRODUCT_NAME: NotchWorkspace
    PRODUCT_BUNDLE_IDENTIFIER: io.github.johnvip.notchworkspace
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "6.0" # Swift 6 language mode: complete strict-concurrency checking
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_LSUIElement: YES # accessory app: no Dock icon, no menu bar
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
    INFOPLIST_KEY_NSHumanReadableCopyright: Copyright © 2026 Niyam Vora. MIT License.
    # Shelf files dropped from protected folders are checked again on later launches.
    INFOPLIST_KEY_NSDesktopFolderUsageDescription: Notch Workspace keeps files you drop on the shelf so you can drag them out later.
    INFOPLIST_KEY_NSDocumentsFolderUsageDescription: Notch Workspace keeps files you drop on the shelf so you can drag them out later.
    INFOPLIST_KEY_NSDownloadsFolderUsageDescription: Notch Workspace keeps files you drop on the shelf so you can drag them out later.
    INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: Notch Workspace shows today's events in the notch, adds the events and time blocks you create there, and changes or deletes the ones you choose. Your calendars stay on this Mac.
    INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: Notch Workspace shows, adds, and completes your reminders in the notch.
    ENABLE_HARDENED_RUNTIME: YES
    # Ad-hoc signing builds and runs without an Apple team; `make` signs local builds with an Apple
    # Development certificate when there is one, and releases are re-signed when they're exported.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""

targets:
  NotchWorkspace:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: ["Info.plist"]
      # The licenses of the code this edition ships, which they ask to travel with it.
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    dependencies:
      - package: OpenNotchKit
        product: NotchCore
      - package: OpenNotchKit
        product: NotchSurface
      - package: OpenNotchKit
        product: NotchFeatures
      - package: OpenNotchKit
        product: NotchAgents
    settings:
      groups: [app]
      base:
        INFOPLIST_FILE: App/Info.plist
        # Hardened Runtime resource access for EventKit.
        CODE_SIGN_ENTITLEMENTS: App/OpenNotch.entitlements

schemes:
  NotchWorkspace:
    build:
      targets:
        NotchWorkspace: all
    test:
      config: Debug
      targets:
        - package: OpenNotchKit/NotchCoreTests
        - package: OpenNotchKit/NotchSurfaceTests
        - package: OpenNotchKit/NotchFeaturesTests
        - package: OpenNotchKit/NotchAgentsTests
        - package: OpenNotchKit/PerformanceTests
    archive:
      config: Release
